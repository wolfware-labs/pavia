name: Capability
description: Implementation work from the roadmap, one capability per issue.
title: "C0.0 "
labels: ["kind/feature"]
body:
  - type: input
    id: roadmap
    attributes:
      label: Roadmap ID and milestone
      placeholder: "C4.7 in M4"
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec sections
      placeholder: "12.4, 8.2"
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What the capability is, in the spec's terms.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks, one per line; they become the checklist.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: Vectors, scripts, property tests, browser runs.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Pitfalls, dependencies on other capabilities, design records.
