name: spec-guard

on:
  pull_request:
    paths:
      - "spec/**"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check spec versioning rules
        run: scripts/spec-guard.sh "origin/${{ github.base_ref }}" "${{ github.sha }}"
