name: spec-guard

on:
  pull_request:
    paths:
      - "spec/**"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check spec versioning rules
        run: scripts/spec-guard.sh "origin/${{ github.base_ref }}" "${{ github.sha }}"
