name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Crate dependency rules
        run: scripts/check-deps.sh

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/typescript/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  vectors:
    name: vectors
    runs-on: ubuntu-latest
    env:
      CHECK_JSONSCHEMA: check-jsonschema==0.38.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Schemas are valid JSON Schema
        run: pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema --check-metaschema vectors/schema/*.schema.json
      - name: Vectors match their schemas
        run: |
          for kind in frames codecs scripts; do
            pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema \
              --schemafile "vectors/schema/$kind.schema.json" vectors/$kind/*.json
          done
      - name: Broken fixtures are rejected
        run: |
          for f in vectors/schema/invalid/*.json; do
            kind=$(basename "$f" | cut -d- -f1)
            if pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema \
                --schemafile "vectors/schema/$kind.schema.json" "$f"; then
              echo "::error file=$f::fixture should fail validation"
              exit 1
            fi
          done

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-10-01
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pavia-proto/fuzz
      - name: Fuzz the varint decoder for 60 seconds
        working-directory: crates/pavia-proto
        run: cargo +nightly-2026-10-01 fuzz run --target x86_64-unknown-linux-gnu varint_decode -- -max_total_time=60
