name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Crate dependency rules
        run: scripts/check-deps.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 1

  codecov:
    name: codecov
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          flags: rust
          use_oidc: true
          fail_ci_if_error: false

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/typescript/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  vectors:
    name: vectors
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHECK_JSONSCHEMA: check-jsonschema==0.38.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Schemas are valid JSON Schema
        run: pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema --check-metaschema vectors/schema/*.schema.json
      - name: Vectors match their schemas
        run: |
          for kind in frames codecs varints headers scripts; do
            pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema \
              --schemafile "vectors/schema/$kind.schema.json" vectors/$kind/*.json
          done
      - name: Broken fixtures are rejected
        run: |
          for f in vectors/schema/invalid/*.json; do
            kind=$(basename "$f" | cut -d- -f1)
            if pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema \
                --schemafile "vectors/schema/$kind.schema.json" "$f"; then
              echo "::error file=$f::fixture should fail validation"
              exit 1
            fi
          done

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-10-01
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/pavia-proto/fuzz
      - name: Fuzz the varint decoder for 10 minutes
        working-directory: crates/pavia-proto
        run: cargo +nightly-2026-10-01 fuzz run --target x86_64-unknown-linux-gnu varint_decode -- -max_total_time=600 -rss_limit_mb=8192 -malloc_limit_mb=512
      - name: Fuzz the header decoder and encoder for 10 minutes
        working-directory: crates/pavia-proto
        run: cargo +nightly-2026-10-01 fuzz run --target x86_64-unknown-linux-gnu header_decode -- -max_total_time=600 -rss_limit_mb=8192 -malloc_limit_mb=512
      - name: Fuzz the frame decoder for 10 minutes
        working-directory: crates/pavia-proto
        run: cargo +nightly-2026-10-01 fuzz run --target x86_64-unknown-linux-gnu frame_decode -- -max_total_time=600 -rss_limit_mb=8192 -malloc_limit_mb=512
      - name: Fuzz the cbor data decoder and encoder for 5 minutes
        working-directory: crates/pavia-proto
        run: cargo +nightly-2026-10-01 fuzz run --target x86_64-unknown-linux-gnu data_cbor -- -max_total_time=300 -rss_limit_mb=8192 -malloc_limit_mb=512
      - name: Fuzz the json data decoder and encoder for 5 minutes
        working-directory: crates/pavia-proto
        run: cargo +nightly-2026-10-01 fuzz run --target x86_64-unknown-linux-gnu data_json -- -max_total_time=300 -rss_limit_mb=8192 -malloc_limit_mb=512
