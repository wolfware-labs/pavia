name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Automatic review, only for pull requests opened by trusted authors.
  auto:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for the Pavia protocol. The PR branch is checked out.

            First read `.github/copilot-instructions.md`, then every file under `.github/instructions/` whose `applyTo` glob matches a changed file. Those documents are the review rules; the spec in `spec/pavia-protocol.md` and the design records in `docs/design/` are the authority.

            Then review the diff (`gh pr diff`) against them. Report only findings that would change the code, the spec text or the vectors: contradictions with the spec, broken invariants, missing vectors for new MUSTs, crate boundary violations, unbounded input handling, secrets in logs, and defects. Cite the spec section or design record for each finding. Do not comment on style, naming or formatting, and do not summarize the change.

            Post findings as inline comments with `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) at the lines they concern. Post one top-level comment with `gh pr comment` only to say whether you found anything blocking; if there are no findings, say so in one sentence.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"

  # Review requested by a maintainer with a "@claude review" comment on any pull request,
  # including those from first-time and outside contributors.
  requested:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            You are reviewing a pull request for the Pavia protocol. The PR branch is checked out.

            First read `.github/copilot-instructions.md`, then every file under `.github/instructions/` whose `applyTo` glob matches a changed file. Those documents are the review rules; the spec in `spec/pavia-protocol.md` and the design records in `docs/design/` are the authority.

            Then review the diff (`gh pr diff`) against them. Report only findings that would change the code, the spec text or the vectors: contradictions with the spec, broken invariants, missing vectors for new MUSTs, crate boundary violations, unbounded input handling, secrets in logs, and defects. Cite the spec section or design record for each finding. Do not comment on style, naming or formatting, and do not summarize the change.

            Post findings as inline comments with `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) at the lines they concern. Post one top-level comment with `gh pr comment` only to say whether you found anything blocking; if there are no findings, say so in one sentence.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
